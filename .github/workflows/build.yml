name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write   # necessario para publicar a Release
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir que a tag bate com a versao do programa
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $versao = (Select-String -Path app/Instalador.cs -Pattern 'Versao = "([^"]+)"').Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($versao -ne $tag) { throw "Tag v$tag diferente da versao do programa ($versao). Atualize app/Instalador.cs e app/Info.cs." }
      - name: Compilar
        shell: powershell
        run: ./build.ps1
      - name: Guardar binario e hash
        uses: actions/upload-artifact@v4
        with:
          name: PastasBarra
          path: |
            dist/PastasBarra.exe
            dist/PastasBarra.exe.sha256
      - name: Publicar Release (so em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/PastasBarra.exe dist/PastasBarra.exe.sha256 --title "${{ github.ref_name }}" --generate-notes
