name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        shell: powershell
        run: ./build.ps1
      - name: Publicar binario e hash
        uses: actions/upload-artifact@v4
        with:
          name: PastasBarra
          path: |
            dist/PastasBarra.exe
            dist/PastasBarra.exe.sha256
